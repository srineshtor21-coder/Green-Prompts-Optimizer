<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Prompts Optimizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 400px;
            min-height: 500px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f1f5f9;
            padding: 0;
        }
        
        .header {
            background: linear-gradient(135deg, #10b981, #3b82f6);
            padding: 1.5rem;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.3rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .container {
            padding: 1.5rem;
        }
        
        .section {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            color: #34d399;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        
        textarea {
            width: 100%;
            padding: 0.8rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: #34d399;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
            font-size: 0.9rem;
        }
        
        button {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .copy-btn {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #34d399;
            margin-top: 0.5rem;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
            margin-top: 1rem;
        }
        
        .stat-box {
            background: rgba(16, 185, 129, 0.1);
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-bottom: 0.3rem;
        }
        
        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #34d399;
        }
        
        .loading {
            text-align: center;
            padding: 1rem;
            color: #34d399;
        }
        
        .spinner {
            border: 3px solid rgba(16, 185, 129, 0.1);
            border-top: 3px solid #34d399;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 0.5rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
        
        .error.active {
            display: block;
        }
        
        .output-section {
            display: none;
        }
        
        .output-section.active {
            display: block;
        }
        
        .footer {
            background: rgba(30, 41, 59, 0.5);
            padding: 1rem;
            text-align: center;
            font-size: 0.75rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌱 Green Prompts</h1>
    </div>
    
    <div class="container">
        <div class="error" id="error-message"></div>
        
        <div class="section">
            <label for="prompt-input">📝 Your Prompt</label>
            <textarea id="prompt-input" rows="5" placeholder="Paste your prompt here..."></textarea>
        </div>
        
        <div class="checkbox-container">
            <input type="checkbox" id="preserve-meaning" checked>
            <label for="preserve-meaning" style="margin: 0;">Preserve Meaning</label>
        </div>
        
        <button id="optimize-btn">🚀 Optimize</button>
        
        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Optimizing...</p>
        </div>
        
        <div class="output-section" id="output-section">
            <div class="section" style="margin-top: 1.5rem;">
                <label for="optimized-output">✨ Optimized</label>
                <textarea id="optimized-output" rows="5" readonly></textarea>
                <button class="copy-btn" id="copy-btn">📋 Copy</button>
            </div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Tokens Saved</div>
                    <div class="stat-value" id="tokens-saved">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Reduction</div>
                    <div class="stat-value" id="reduction-pct">0%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Energy Saved</div>
                    <div class="stat-value" id="energy-saved">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">CO₂ Saved</div>
                    <div class="stat-value" id="co2-saved">0</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        Making AI sustainable 🌍
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
