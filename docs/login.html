<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Green Prompts Optimizer</title>
    <link rel="icon" type="image/svg+xml" href="gpo-icon.svg">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#0d1b2a;color:#f1f5f9;min-height:100vh;display:flex;flex-direction:column;}
        .go{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 30% 40%,rgba(52,211,153,.05) 0%,transparent 50%),radial-gradient(circle at 70% 60%,rgba(59,130,246,.04) 0%,transparent 50%);}
        header{background:rgba(13,27,42,.97);backdrop-filter:blur(12px);padding:.9rem 3rem;border-bottom:1px solid rgba(52,211,153,.15);}
        .logo{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:#34d399;font-size:1.25rem;font-weight:700;}
        .logo-icon{width:36px;height:36px;flex-shrink:0;}
        .pc{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem;}
        .card{background:rgba(22,34,51,.9);backdrop-filter:blur(14px);border:1px solid rgba(52,211,153,.2);border-radius:22px;padding:3rem 2.5rem;width:100%;max-width:460px;}
        .card h1{font-size:2rem;color:#34d399;font-weight:800;text-align:center;margin-bottom:.5rem;}
        .sub{color:#64748b;text-align:center;font-size:.95rem;margin-bottom:2rem;}
        .field{margin-bottom:1.3rem;}
        .field label{display:block;color:#94a3b8;font-size:.85rem;font-weight:600;text-transform:uppercase;margin-bottom:.5rem;}
        .field input{width:100%;padding:.9rem 1rem;background:rgba(13,27,42,.8);border:1.5px solid rgba(52,211,153,.2);border-radius:9px;color:#f1f5f9;font-size:1rem;font-family:inherit;transition:border-color .25s,box-shadow .25s;}
        .field input:focus{outline:none;border-color:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.12);}
        .field input::placeholder{color:#475569;}
        .btn-sub{width:100%;padding:1rem;background:linear-gradient(135deg,#34d399,#3b82f6);border:none;border-radius:10px;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;transition:all .3s;margin-top:.5rem;}
        .btn-sub:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px rgba(52,211,153,.4);}
        .btn-sub:disabled{opacity:.6;cursor:not-allowed;}
        .bn{padding:.85rem 1.1rem;border-radius:9px;font-weight:600;text-align:center;margin-bottom:1rem;display:none;}
        .bn.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;}
        .bn.success{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:#6ee7b7;}
        .af{text-align:center;margin-top:1.8rem;color:#64748b;font-size:.92rem;}
        .af a{color:#34d399;text-decoration:none;font-weight:600;}
        .af a:hover{text-decoration:underline;}
        footer{background:rgba(13,27,42,.97);padding:1.5rem;text-align:center;border-top:1px solid rgba(52,211,153,.12);}
        footer p{color:#64748b;font-size:.85rem;}
    </style>
</head>
<body>
<div class="go"></div>
<header>
    <a href="index.html" class="logo">
        <img class="logo-icon" src="gpo-icon.svg" alt="GPO">
        Green Prompts Optimizer
    </a>
</header>
<div class="pc">
    <div class="card">
        <h1>Welcome Back</h1>
        <p class="sub">Log in to track your environmental impact</p>
        <div class="bn error" id="err"></div>
        <div class="bn success" id="ok"></div>
        <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@example.com"></div>
        <div class="field"><label>Password</label><input type="password" id="pw" placeholder="Enter your password"></div>
        <button class="btn-sub" id="btn">Login</button>
        <div class="af">Don't have an account? <a href="signup.html">Sign up free</a></div>
    </div>
</div>
<footer><p>Green Prompts Optimizer &mdash; Making AI more sustainable</p></footer>
<script src="stats_tracker.js"></script>
<script src="auth.js"></script>
<script>
if(window.AUTH&&window.AUTH.getSession())window.location.href='dashboard.html';
const err=document.getElementById('err'),ok=document.getElementById('ok');
document.getElementById('btn').addEventListener('click',()=>{
    const email=document.getElementById('email').value.trim();
    const pw=document.getElementById('pw').value;
    err.style.display='none';ok.style.display='none';
    if(!email||!pw){err.textContent='Please fill in all fields.';err.style.display='block';return;}
    const r=window.AUTH.login(email,pw);
    if(!r.ok){err.textContent=r.error;err.style.display='block';return;}
    ok.textContent='Logged in! Redirecting...';ok.style.display='block';
    setTimeout(()=>window.location.href='dashboard.html',900);
});
document.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn').click();});
</script>
</body>
</html>
